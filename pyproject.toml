[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `E` and `F` for error/warning codes, `I` for isort support
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
lines-after-imports = 2

[tool.mypy]
disable_error_code = "import-untyped"
